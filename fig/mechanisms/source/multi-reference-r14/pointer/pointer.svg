<svg xmlns="http://www.w3.org/2000/svg" width="240.247pt" height="93.906pt" viewBox="0 0 241 94.2"><title>Pointer assignment across construction and refresh</title><desc>With h=2 the first slot to contribute twice decides the next pointer. Read the four values left to right in each replay. At construction the third value, 5, exhausts R; the loser [5,7] stays at the parent and enters L together at the next replay. Then the third value, 7, exhausts L. Dashed rings mark unread child rows.</desc><rect width="241" height="94.2" fill="white"/><g font-family="Liberation Serif,serif"><path d="M70.5 64.9 H113.5 Q117.6 64.9 117.6 60.8 V27.1 Q117.6 23.1 121.7 23.1 H136.4" stroke="#3F6675" stroke-width="0.77" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M137.2 23.1 L134.89999999999998 24.158 L134.89999999999998 22.042 Z" stroke="#3F6675" stroke-width="0.25" fill="#3F6675" stroke-linecap="round" stroke-linejoin="round"/><text x="56.75" y="6.85" text-anchor="middle" font-size="8.65" fill="#282B2B" font-weight="bold" font-style="normal">(a) Tree construction</text><text x="30" y="15.9" text-anchor="middle" font-size="6.85" fill="#565958" font-weight="normal" font-style="normal">Left child</text><text x="12.8" y="25.6" text-anchor="middle" font-size="7.0" fill="#282B2B" font-weight="bold" font-style="normal">L</text><rect x="17.8" y="17.450000000000003" width="24.4" height="11.3" rx="5.65" fill="white" stroke="#8A908B" stroke-width="0.6"/><path d="M30 19.0 v8.2" stroke="#8A908B" stroke-width="0.38" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="24.1" y="25.6" text-anchor="middle" font-size="7.5" fill="#282B2B" font-weight="normal" font-style="normal">3</text><text x="35.9" y="25.6" text-anchor="middle" font-size="7.5" fill="#282B2B" font-weight="normal" font-style="normal">7</text><text x="85" y="15.9" text-anchor="middle" font-size="6.85" fill="#565958" font-weight="normal" font-style="normal">Right child</text><text x="67.8" y="25.6" 