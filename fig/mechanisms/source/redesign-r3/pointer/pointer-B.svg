<svg xmlns="http://www.w3.org/2000/svg" width="240.2465515pt" height="108.6pt" viewBox="0 0 240.2465515 108.6">
<title>Which child is next? Two rank ledgers (h=2)</title><desc>Read left to right. In each of two local replays, the first two ranked rows are the winner, the last two remain in P, and the first slot to hit entry 2/2 determines the next pointer. On refresh the old right pointer admits replacement [6,14] into R while stored loser [5,7] occupies L.</desc>
