<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980" role="img"><title>Node replay and pointer update</title><desc>Two rows show initialization and a subsequent refresh of the same node. During refresh the old pointer is R, the new right segment enters logical slot R, and the parent loser enters logical slot L. Slot L exhausts first, so the pointer flips to L. Replay uses an existing rank map and is not an additional LLM call.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#262b30"/></marker><marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#899198"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif">
