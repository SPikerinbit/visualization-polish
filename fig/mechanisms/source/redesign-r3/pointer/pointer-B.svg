<text x="2.000" y="8.300" text-anchor="start" font-family="Liberation Serif" font-size="8.35" font-weight="700" fill="#252421">In rank order, the first slot to supply two rows sets the pointer.</text>
<text x="3.000" y="18.600" text-anchor="start" font-family="Liberation Serif" font-size="6.65" font-weight="700" fill="#625c54">Replay inputs</text>
<text x="73.000" y="18.600" text-anchor="start" font-family="Liberation Serif" font-size="6.65" font-weight="700" fill="#625c54">Ranked rows</text>
<text x="177.000" y="18.600" text-anchor="start" font-family="Liberation Serif" font-size="6.65" font-weight="700" fill="#625c54">Updated node</text>
