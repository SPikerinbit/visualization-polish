</g></svg></figure></section></main><script>let editing=false,drag=null,undo=[];const btn=document.querySelector('#edit');btn.onclick=()=>{editing=!editing;btn.textContent=editing?'结束编辑':'编辑文字与位置';document.body.classList.toggle('editing',editing)};document.addEventListener('dblclick',e=>{if(!editing||e.target.tagName.toLowerCase()!=='text')return;const v=prompt('修改文字',e.target.textContent);if(v!==null){undo.push([e.target,'text',e.target.textContent]);e.target.textContent=v}});document.addEventListener('pointerdown',e=>{if(!editing||e.button!==0)return;const g=e.target.closest('[data-edit-group]');if(!g)return;const svg=g.ownerSVGElement,p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());const old=g.getAttribute('transform')||'';drag={g,svg,p,old};});document.addEventListener('pointermove',e=>{if(!drag)return;const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(drag.svg.getScreenCTM().inverse());drag.g.setAttribute('transform','translate('+(p.x-drag.p.x)+' '+(p.y-drag.p.y)+') '+drag.old)});document.addEventListener('pointerup',()=>{if(drag){if((drag.g.getAttribute('transform')||'')!==drag.old)undo.push([drag.g,'transform',drag.old]);drag=null}});document.querySelector('#undo').onclick=()=>{const u=undo.pop();if(!u)return;if(u[1]==='text')u[0].textContent=u[2];else u[0].setAttribute('transform',u[2])};function save(svg,name){const out=svg.cloneNode(true);out.setAttribute('xmlns','http://www.w3.org/2000/svg');const b=new Blob([new XMLSerializer().serializeToString(out)],{type:'image/svg+xml'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.closest('section').querySelector('svg'),b.dataset.save));</script></html>
